name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Force Node 24 runtime for every JS action regardless of pinned version.
# Node 20 is deprecated on GitHub Actions runners as of 2026-06-02; this
# env opts in now. Becomes a no-op once Node 24 is the runner default --
# can be removed then. (Most actions here are already Node-24-native --
# checkout@v6, upload-artifact@v7 -- but actions/cache@v4 still ships
# Node 20; this env covers the gap until the next version lands.)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=tests-${{ matrix.rid }}.trx"

      - name: Publish (Native AOT)
        shell: pwsh
        run: |
          dotnet publish src/Nexus.Cli/Nexus.Cli.csproj `
            -c Release -r ${{ matrix.rid }} `
            -o artifacts/${{ matrix.rid }}

      - name: Size budget (<= 30 MB, Phase 0.G gate per ADR-0024)
        shell: pwsh
        run: pwsh -File scripts/cli.ps1 size-check -Rid ${{ matrix.rid }}

      - name: Smoke (--version + --help)
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.rid }}' -eq 'win-x64') { './artifacts/win-x64/nexus.exe' } else { './artifacts/linux-x64/nexus' }
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          if (-not $IsWindows) { chmod +x $exe }
          & $exe --version
          & $exe --help | Out-Null

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexus-cli-${{ matrix.rid }}-${{ github.sha }}
          path: artifacts/${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 14
